<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Join Our Discord</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: "Courier New", monospace;
      color: white;

      /* Pixel-style background */
      background:
        linear-gradient(45deg, #111 25%, transparent 25%),
        linear-gradient(-45deg, #111 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #222 75%),
        linear-gradient(-45deg, transparent 75%, #222 75%);

      background-size: 32px 32px;
      background-position:
        0 0,
        0 16px,
        16px -16px,
        -16px 0;

      background-color: #151515;
    }

    /* Main page container */
    .container {
      width: min(900px, 90%);

      padding: 45px 30px;

      text-align: center;

      border: 4px solid #aaa;

      background: rgba(10, 10, 10, 0.94);

      box-shadow:
        8px 8px 0 #555,
        16px 16px 0 #222;
    }

    /* Main title */
    h1 {
      margin: 0 0 35px;

      font-size: clamp(28px, 6vw, 58px);

      color: #eee;

      text-shadow:
        4px 4px 0 #555,
        7px 7px 0 #111;

      letter-spacing: 2px;
    }

    /* Subtitle */
    .subtitle {
      margin-bottom: 35px;

      color: #aaa;

      font-size: 16px;
    }

    /* Holds the two image cards */
    .spaces {
      display: flex;

      justify-content: center;
      align-items: flex-start;

      gap: 60px;

      flex-wrap: wrap;
    }

    /* Individual image card */
    .image-card {
      width: 240px;

      text-align: center;
    }

    /* Fixed-size image area */
    .image-box {
      width: 220px;
      height: 220px;

      margin: 0 auto;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #1c1c1c;

      border: 4px dashed #888;

      position: relative;
    }

    /* Inner pixel-style border */
    .image-box::before {
      content: "";

      position: absolute;

      inset: 8px;

      border: 2px solid #333;

      pointer-events: none;
    }

    /* Actual images */
    .image-box img {
      display: block;

      max-width: 180px;
      max-height: 180px;

      width: auto;
      height: auto;

      position: relative;

      z-index: 1;
    }

    /* Text underneath each image */
    .image-label {
      margin-top: 14px;

      color: #aaa;

      font-size: 14px;

      text-align: center;

      letter-spacing: 1px;
    }

    /* Discord button */
    .discord-button {
      display: inline-block;

      margin-top: 40px;

      padding: 15px 30px;

      color: #111;

      background: #ccc;

      border: 4px solid #888;

      text-decoration: none;

      font-weight: bold;

      font-size: 18px;

      box-shadow: 6px 6px 0 #555;

      transition: 0.1s;
    }

    /* Button hover effect */
    .discord-button:hover {
      background: white;

      transform: translate(3px, 3px);

      box-shadow: 3px 3px 0 #555;
    }

    /* Footer */
    .footer {
      margin-top: 35px;

      color: #666;

      font-size: 12px;
    }

    /* Mobile layout */
    @media (max-width: 600px) {
      .container {
        padding: 35px 20px;
      }

      .spaces {
        gap: 35px;
      }

      h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <!-- MAIN TITLE -->
    <h1>JOIN OUR DISCORD SERVER!</h1>

    <!-- SUBTITLE -->
    <p class="subtitle">
      Scan the QR code or click below to join our community.
    </p>


    <!-- IMAGE SECTION -->
    <div class="spaces">

      <!-- CLUB LOGO -->
      <div class="image-card">

        <div class="image-box">
          <img
            src="images/club_logo.png"
            alt="Club Logo"
          >
        </div>

        <div class="image-label">
          OUR CLUB
        </div>

      </div>


      <!-- QR CODE -->
      <div class="image-card">

        <div class="image-box">
          <img
            src="images/qr_code.png"
            alt="Discord QR Code"
          >
        </div>

        <div class="image-label">
          SCAN TO JOIN
        </div>

      </div>

    </div>


    <!-- DISCORD BUTTON -->
    <!-- Replace # with your Discord invite link -->
    <!-- <a
      class="discord-button"
      href="#"
      target="_blank"
      rel="noopener noreferrer"
    >
      &gt; JOIN DISCORD &lt;
    </a> -->


    <!-- FOOTER -->
    <div class="footer">
      /// CONNECT • CHAT • HAVE FUN ///
    </div>

  </main>

</body>
</html>
